# BizNext Agent — frontend (SPA) + reverse proxy на backend.
# Файл заменяет /etc/nginx/conf.d/default.conf внутри образа nginx.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # SSE-поток агента: никакой буферизации и кэша, длинный таймаут чтения.
    location = /api/agent/ask/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;

        # подсказка внешним прокси (если перед этим nginx есть ещё один) не буферизовать поток
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache" always;
    }

    # Приём данных от BizNext Connector (§56): пакеты до 16 МБ, авторизация токеном источника в backend.
    location /api/ingest/ {
        client_max_body_size 16m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # синхронный POST /api/agent/ask тоже может думать долго
        proxy_read_timeout 300s;
    }

    # Хэшированные ассеты Vite — кэшируются навсегда.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: любые клиентские маршруты отдают index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
