# BizNext Agent — весь стек поднимается одной командой:  docker compose up -d --build
# Целевая среда: домашний Linux-сервер. Облака, Kubernetes и managed PostgreSQL не нужны.
#
# Сети (§56, docs/CONNECTORS.md):
#   default    — BizNext: db, backend, web;
#   enterprise — «сеть предприятия»: 1С (эмулятор onec-demo) и BizNext Connector. У backend и агента
#                нет маршрута к 1С; коннектор сам отправляет разрешённые данные в BizNext (исходящие запросы).
name: ${COMPOSE_PROJECT_NAME:-biznext}

services:
  db:
    image: postgres:17.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      DATA_SCHEMA: ${DATA_SCHEMA:-demo}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-15000}
      TZ: ${APP_TIMEZONE:-Asia/Almaty}
      PGTZ: ${APP_TIMEZONE:-Asia/Almaty}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # выполняется только при первой инициализации тома: роли, схемы, права
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразовый сервис: идемпотентные миграции коннекторов (роль ingest, схема ingest, канонические таблицы).
  migrate:
    build: ./database/seed
    restart: "no"
    command: ["python", "migrate.py"]
    environment:
      SEED_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      APP_DB_USER: ${APP_DB_USER}
      AGENT_DB_USER: ${AGENT_DB_USER}
      INGEST_DB_USER: ${INGEST_DB_USER:-biznext_ingest}
      INGEST_DB_PASSWORD: ${INGEST_DB_PASSWORD:?run scripts/init_env.py --add-missing}
      CONTRACT_PATH: /contracts/canonical/v1.yaml
      SOURCES_PATH: /semantic/sources.yaml
    volumes:
      - ./contracts:/contracts:ro
      - ./semantic:/semantic:ro
    depends_on:
      db:
        condition: service_healthy

  # Одноразовый сервис: наполняет схему demo синтетическими данными, если она пуста,
  # и выгружает тот же бизнес как инфобазу 1С для демо-режима коннектора.
  seed:
    build: ./database/seed
    restart: "no"
    environment:
      SEED_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_SCHEMA: ${DATA_SCHEMA:-demo}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Almaty}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-20260914}
      SEED_END_DATE: ${SEED_END_DATE:-}
      SEED_FORCE: ${SEED_FORCE:-0}
      AGENT_DB_USER: ${AGENT_DB_USER}
      APP_DB_USER: ${APP_DB_USER}
      ONEC_INFOBASE_PATH: /infobase/demo_1c.sqlite
    volumes:
      - onec_infobase:/infobase
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # приложение (история, traces) и агент ходят в БД под РАЗНЫМИ пользователями
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      AGENT_DATABASE_URL: postgresql://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_SCHEMA: ${DATA_SCHEMA:-demo}
      SEMANTIC_DIR: /app/semantic
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Almaty}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_EFFORT: ${LLM_EFFORT:-high}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-16000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_FALLBACKS: ${LLM_FALLBACKS:-auto}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-10}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-30}
      AGENT_MAX_SQL_RETRIES: ${AGENT_MAX_SQL_RETRIES:-3}
      AGENT_MAX_ROWS_TO_LLM: ${AGENT_MAX_ROWS_TO_LLM:-60}
      AGENT_MAX_RESULT_CHARS_TO_LLM: ${AGENT_MAX_RESULT_CHARS_TO_LLM:-12000}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-180}
      AGENT_HISTORY_TURNS: ${AGENT_HISTORY_TURNS:-6}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-500}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-15000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      INSIGHTS_CACHE_SECONDS: ${INSIGHTS_CACHE_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # §56: приём данных от коннекторов — отдельная роль БД и токен на каждый источник
      CONTRACTS_DIR: /app/contracts
      INGEST_DATABASE_URL: postgresql://${INGEST_DB_USER:-biznext_ingest}:${INGEST_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      INGEST_TOKENS: onec_demo:${CONNECTOR_TOKEN:-}
    volumes:
      - ./semantic:/app/semantic:ro
      - ./contracts:/app/contracts:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8095}:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------- «сеть предприятия» (демо-режим 1С)

  # Эмулятор публикации 1С (standard.odata) над выгруженной инфобазой. Только чтение, Basic-аутентификация.
  onec-demo:
    build: ./onec_demo
    restart: unless-stopped
    environment:
      ONEC_INFOBASE_PATH: /infobase/demo_1c.sqlite
      ONEC_DEMO_USER: ${ONEC_DEMO_USER:-biznext_reader}
      ONEC_DEMO_PASSWORD: ${ONEC_DEMO_PASSWORD:?run scripts/init_env.py --add-missing}
    volumes:
      - onec_infobase:/infobase:ro
    networks: [enterprise]
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # BizNext Connector: читает 1С через OData под read-only пользователем и отправляет канонические
  # данные в BizNext ingest API. В реальном внедрении ставится на сервер внутри сети предприятия.
  connector:
    build:
      context: .
      dockerfile: connector/Dockerfile
    restart: unless-stopped
    environment:
      BIZNEXT_URL: http://backend:8000
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?run scripts/init_env.py --add-missing}
      ONEC_ODATA_URL: http://onec-demo:8080/demo_foods/odata/standard.odata
      ONEC_USER: ${ONEC_DEMO_USER:-biznext_reader}
      ONEC_PASSWORD: ${ONEC_DEMO_PASSWORD}
      CONNECTOR_TIMEZONE: ${APP_TIMEZONE:-Asia/Almaty}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      FULL_SYNC_TIME: ${FULL_SYNC_TIME:-03:40}
      CONNECTOR_EXCLUDE_FIELDS: ${CONNECTOR_EXCLUDE_FIELDS:-customers.tax_id,suppliers.tax_id}
    networks: [default, enterprise]
    depends_on:
      backend:
        condition: service_healthy
      onec-demo:
        condition: service_healthy

networks:
  default:
  enterprise:
    internal: true

volumes:
  pgdata:
  onec_infobase:
